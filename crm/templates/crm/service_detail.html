{% extends 'crm/base.html' %}

{% block content %}
    <h2>{{ service.title }}</h2>
    <p><b>Описание:</b> {{ service.description }}</p>
    <p><b>Стоимость:</b> {{ service.price }} руб.</p>

    <br>
    <a href="{% url 'service_update' service.pk %}">Редактировать</a> |
    <a href="{% url 'service_list' %}">Назад к списку</a>
{% endblock %}
